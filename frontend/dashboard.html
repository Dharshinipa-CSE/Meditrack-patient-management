<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | MediTrack Patient Records</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <h2>🩺 MediTrack Patient Records</h2>
  <div class="user-info">
    <span>Logged in as <strong id="loggedInUser"></strong></span>
    <button class="btn secondary small" id="logoutBtn">Logout</button>
  </div>
</div>

<div class="container">

  <div class="toolbar">
    <div class="toolbar-left">
      <input type="text" id="searchInput" placeholder="Search by name, patient ID, diagnosis, or doctor...">
      <select id="statusFilter" class="status-filter">
        <option value="">All statuses</option>
        <option value="ADMITTED">Admitted</option>
        <option value="TREATMENT">Under Treatment</option>
        <option value="DISCHARGED">Discharged</option>
      </select>
    </div>
    <button class="btn small" id="addPatientBtn">+ Add Patient</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Patient ID</th>
          <th>Name</th>
          <th>Age / Gender</th>
          <th>Diagnosis</th>
          <th>Doctor</th>
          <th>Status</th>
          <th>Admitted On</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="patientsTableBody">
        <!-- rows injected by app.js -->
      </tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">
      No patients found. Click "Add Patient" to create the first record.
    </div>
  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Add Patient</h3>
    <form id="patientForm" novalidate>
      <input type="hidden" id="patientRecordId">

      <div class="form-row">
        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" required>
          <small class="error" id="nameError"></small>
        </div>
        <div class="field">
          <label for="patient_id">Patient ID</label>
          <input type="text" id="patient_id" required>
          <small class="error" id="patient_idError"></small>
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" min="1" max="130" required>
          <small class="error" id="ageError"></small>
        </div>
        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender" required>
            <option value="">Select</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
            <option value="O">Other</option>
          </select>
          <small class="error" id="genderError"></small>
        </div>
      </div>

      <div class="field">
        <label for="contact_number">Contact Number</label>
        <input type="text" id="contact_number" placeholder="10-digit number" required>
        <small class="error" id="contact_numberError"></small>
      </div>

      <div class="field">
        <label for="email">Email (optional)</label>
        <input type="email" id="email">
        <small class="error" id="emailError"></small>
      </div>

      <div class="field">
        <label for="diagnosis">Diagnosis</label>
        <input type="text" id="diagnosis" required>
        <small class="error" id="diagnosisError"></small>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="doctor_assigned">Doctor Assigned</label>
          <input type="text" id="doctor_assigned" required>
          <small class="error" id="doctor_assignedError"></small>
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" required>
            <option value="ADMITTED">Admitted</option>
            <option value="TREATMENT">Under Treatment</option>
            <option value="DISCHARGED">Discharged</option>
          </select>
          <small class="error" id="statusError"></small>
        </div>
      </div>

      <div class="field">
        <label for="admission_date">Admission Date</label>
        <input type="date" id="admission_date" required>
        <small class="error" id="admission_dateError"></small>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn" id="saveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteOverlay">
  <div class="modal">
    <h3>Delete patient record?</h3>
    <p id="deleteMessage" style="color:var(--muted);"></p>
    <div class="modal-actions">
      <button type="button" class="btn secondary" id="cancelDeleteBtn">Cancel</button>
      <button type="button" class="btn danger" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
